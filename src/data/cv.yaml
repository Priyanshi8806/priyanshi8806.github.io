summary: >-
  Research Associate working at the intersection of Information Systems, AI,
  digital technologies, and decision-making. My research uses causal inference,
  large-scale digital-trace and text data, NLP/LLM evaluation, panel methods,
  and machine learning to study how emerging technologies affect organizations,
  work, and communities.

