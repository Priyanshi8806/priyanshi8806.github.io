  - title: Research Experience
    items:
      - what: "Research Associate"
        where: "Indian School of Business (ISB), Hyderabad · Information Systems · Primary advisor: Prof. Deepa Mani"
        when: "Dec 2024 – Present"
        details:
          - "Execute end-to-end empirical research workflows spanning research design, literature synthesis, large-scale data construction, statistical analysis, robustness checks, visualization, and academic writing."
          - "Built and audited LLM-generation pipelines on HPC infrastructure; developed paired India–U.S. Reddit datasets and evaluated geographic differences using sentence embeddings, fixed effects, and clustered inference."
