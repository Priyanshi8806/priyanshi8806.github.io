          - "Built Indian-patent research infrastructure covering 654,186 published and 101,648 granted patents, with detailed records for 359,391+ publications."
          - "Developed an initial cloze/question-answer framework for evaluating GPT-based responses in U.S. and Indian startup settings, with attention to factuality, safety, and high-risk-domain evaluation."

