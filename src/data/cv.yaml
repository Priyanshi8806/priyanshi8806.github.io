  - title: Academic Projects
    items:
      - what: "Did the US–China Trade War Boost Corporate R&D? Evidence from a Difference-in-Differences Design"
        where: "Econometrics B, ISB · PhD-level FPM course · Instructor: Prof. Manisha Chakrabarty · Group project"
        when: "May 2026"
        details:
          - "Built a Compustat panel for 2015–2022 with 14,641 firm-year observations and 1,959 firms, together with industry-level tariff exposure."
          - "Estimated two-way fixed-effects DiD models, event-study and placebo specifications, and robustness checks with clustered standard errors."
          - "Found that R&D-active high-tech firms increased R&D by approximately 9.4 percentage points more than low-tech peers after the 2018 tariff shock; examined the role of IT/software in the estimated effect."

      - what: "Replication: Does Women’s Labor Force Participation Reduce Domestic Violence?"
        where: "Econometrics A, ISB · PhD-level FPM course · Instructor: Prof. Bhavana Rai"
        when: "2026"
        details:
          - "Replicated descriptive tables and econometric specifications using Jordan DHS microdata."
          - "Reconstructed emotional, physical, sexual, and aggregate domestic-violence outcomes and labour-force participation measures."
          - "Implemented multivariate specifications and endogeneity corrections, including IV/2SLS and 2SRI using a leave-one-out cluster-level female labour-force-participation instrument."

      - what: "Ergonomic Evaluation of Healthcare Work Systems in India"
        where: "M.Tech Thesis · Advisor: Prof. Pradip Kumar Ray, IIT Kharagpur"
        details:
          - "Conducted field-based ergonomic assessment of nurses using questionnaire, anthropometric, and postural data."
          - "Applied Nordic musculoskeletal measures, Body Part Discomfort measures, and OWAS to identify high-risk activities and intervention opportunities."

      - what: "Bank Lending Decisions Optimization"
        where: "Advisor: Dr. Akhilesh Kumar, IIT Kharagpur"
        when: "Mar 2021 – Apr 2021"
        details:
          - "Formulated dynamic bank lending as a multi-objective optimization problem balancing profitability and default risk."
          - "Implemented genetic algorithms, simulated annealing, and a hybrid heuristic and compared solution quality."

      - what: "Construction Project Scheduling Optimization"
        where: "Advisor: Prof. V. A. Achutha Naikan, IIT Kharagpur"
        when: "Aug 2021 – Nov 2021"
        details:
          - "Applied CPM/PERT to identify critical activities and bottlenecks, analyse time–cost trade-offs, and derive feasible schedules across alternative project-completion dates."

      - what: "Thief-Tracking Simulation Model"
        when: "Mar 2021 – Apr 2021"
        details:
          - "Built an Arena discrete-event simulation of police pursuit and interception under varying traffic conditions."
          - "Evaluated resource deployment, pursuit success probability, and service levels."

      - what: "Virtual-Reality Simulation of a Car Interior"
        when: "Jan 2020 – Apr 2020"
        details:
          - "Applied anthropometry and work-system-design principles to passenger-car interiors."
          - "Developed a 3D front-seat/dashboard model in Google SketchUp for later simulation in Unity3D."

